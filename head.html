<!--
  SEO / META HEAD TEMPLATE
  Copy this into the <head> of every page.
  Replace placeholder values marked with {{PLACEHOLDER}}.
-->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Primary Meta -->
<title>{{PAGE_TITLE}} — {{BUSINESS_NAME}}</title>
<meta name="description" content="{{PAGE_DESCRIPTION — 150-160 chars}}">
<meta name="author" content="{{BUSINESS_NAME}}">
<!-- Allow Google to show a large image preview / thumbnail next to search results.
     Omit on noindex pages (they carry their own robots meta). -->
<meta name="robots" content="max-image-preview:large">

<!-- Canonical URL -->
<link rel="canonical" href="{{FULL_PAGE_URL}}">

<!-- Open Graph / Facebook.
     og:image doubles as Google's preferred search-result thumbnail signal. For
     person-led businesses (therapist, physio, coach…) use a SQUARE headshot of the
     practitioner (>=600x600) on the homepage + about page — competitors with a face
     thumbnail in search results get it from this + a Person schema block, never from
     CSS background images (Google does not index CSS backgrounds). -->
<meta property="og:type" content="website">
<meta property="og:url" content="{{FULL_PAGE_URL}}">
<meta property="og:title" content="{{PAGE_TITLE}} — {{BUSINESS_NAME}}">
<meta property="og:description" content="{{PAGE_DESCRIPTION — 150-160 chars}}">
<meta property="og:image" content="{{ABSOLUTE_URL_TO_SHARE_IMAGE — 1200x630px}}">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{PAGE_TITLE}} — {{BUSINESS_NAME}}">
<meta name="twitter:description" content="{{PAGE_DESCRIPTION — 150-160 chars}}">
<meta name="twitter:image" content="{{ABSOLUTE_URL_TO_SHARE_IMAGE — 1200x630px}}">

<!-- Favicon — MUST be a real, crawlable image file. Google Search only shows a
     favicon if Googlebot-Image can fetch a square icon >=48x48px from a stable URL;
     a data: URI is NOT crawlable and leaves the generic globe icon in search results.
     At build time, generate from the client logo (square, white or transparent bg):
       images/favicon.png          96x96   (multiple of 48 — Google's requirement)
       images/apple-touch-icon.png 180x180 (iOS home screen)
     Paths are RELATIVE (never a leading slash — root-absolute /favicon.* 404s on
     GitHub Pages project sites). Pages inside blog/ use ../images/… instead. -->
<link rel="icon" href="images/favicon.png" type="image/png" sizes="96x96">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">

<!-- Preconnect for Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Stylesheets — ORDER IS CRITICAL: base → components → theme.
     theme.css MUST load LAST so client overrides beat component defaults. -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/theme.css">

<!--
  STRUCTURED DATA (LocalBusiness)
  Place this script tag just before </head>.
  Replace all placeholder values.
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "{{BUSINESS_NAME}}",
  "description": "{{BUSINESS_DESCRIPTION}}",
  "url": "{{SITE_URL}}",
  "telephone": "{{PHONE_NUMBER}}",
  "email": "{{EMAIL_ADDRESS}}",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "{{STREET_ADDRESS}}",
    "addressLocality": "{{CITY}}",
    "postalCode": "{{POSTCODE}}",
    "addressCountry": "GB"
  },
  "openingHours": [
    "Mo-Fr 09:00-17:00"
  ],
  "image": "{{ABSOLUTE_URL_TO_BUSINESS_IMAGE}}",
  "priceRange": "{{PRICE_RANGE e.g. ££}}"
}
</script>

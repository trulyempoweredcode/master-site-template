<!--
  SEO / META HEAD TEMPLATE
  Copy this into the <head> of every page.
  Replace placeholder values marked with {{PLACEHOLDER}}.
-->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Primary Meta -->
<title>{{PAGE_TITLE}} — {{BUSINESS_NAME}}</title>
<meta name="description" content="{{PAGE_DESCRIPTION — 150-160 chars}}">
<meta name="author" content="{{BUSINESS_NAME}}">

<!-- Canonical URL -->
<link rel="canonical" href="{{FULL_PAGE_URL}}">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="{{FULL_PAGE_URL}}">
<meta property="og:title" content="{{PAGE_TITLE}} — {{BUSINESS_NAME}}">
<meta property="og:description" content="{{PAGE_DESCRIPTION — 150-160 chars}}">
<meta property="og:image" content="{{ABSOLUTE_URL_TO_SHARE_IMAGE — 1200x630px}}">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{PAGE_TITLE}} — {{BUSINESS_NAME}}">
<meta name="twitter:description" content="{{PAGE_DESCRIPTION — 150-160 chars}}">
<meta name="twitter:image" content="{{ABSOLUTE_URL_TO_SHARE_IMAGE — 1200x630px}}">

<!-- Favicon — inline SVG data URI: no external file, works at ANY path
     (incl. GitHub Pages project sites served from /{domain}/, where a root-absolute
     /favicon.ico resolves to the org root and 404s). Replace {{FAVICON_EMOJI}} with an
     emoji that fits the business (🦷 dental, 🌿 wellness, ⚖️ legal, 📷 photography…),
     OR swap the whole tag for a real, RELATIVE-path icon made from the client logo:
       <link rel="icon" href="favicon.svg" type="image/svg+xml">   (never a leading slash) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>{{FAVICON_EMOJI}}</text></svg>" type="image/svg+xml">

<!-- Preconnect for Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Stylesheets — ORDER IS CRITICAL: base → components → theme.
     theme.css MUST load LAST so client overrides beat component defaults. -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/theme.css">

<!--
  STRUCTURED DATA (LocalBusiness)
  Place this script tag just before </head>.
  Replace all placeholder values.
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "name": "{{BUSINESS_NAME}}",
  "description": "{{BUSINESS_DESCRIPTION}}",
  "url": "{{SITE_URL}}",
  "telephone": "{{PHONE_NUMBER}}",
  "email": "{{EMAIL_ADDRESS}}",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "{{STREET_ADDRESS}}",
    "addressLocality": "{{CITY}}",
    "postalCode": "{{POSTCODE}}",
    "addressCountry": "GB"
  },
  "openingHours": [
    "Mo-Fr 09:00-17:00"
  ],
  "image": "{{ABSOLUTE_URL_TO_BUSINESS_IMAGE}}",
  "priceRange": "{{PRICE_RANGE e.g. ££}}"
}
</script>
